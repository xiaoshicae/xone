<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 828" width="1180" height="828" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect width="1180" height="828" fill="#ffffff"/>

  <!-- ================= 标题 ================= -->
  <text x="32" y="42" font-size="25" font-weight="700" fill="#1e293b">XOne 模块架构图</text>
  <text x="32" y="66" font-size="13" fill="#64748b">Go 三方库集成框架 SDK — 分层依赖与生命周期</text>
  <text x="1148" y="42" font-size="12" fill="#94a3b8" text-anchor="end">v2.28.1</text>

  <!-- ================= 依赖方向轴 ================= -->
  <line x1="20" y1="100" x2="20" y2="592" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="14" y="350" font-size="11" fill="#94a3b8" text-anchor="middle" transform="rotate(-90 14 350)">依赖方向：上层 → 下层</text>

  <!-- ================= 应用层 ================= -->
  <rect x="32" y="92" width="756" height="92" rx="8" fill="#faf8ff" stroke="#e2e8f0"/>
  <text x="46" y="116" font-size="11" font-weight="700" fill="#7c3aed">APPLICATION</text>
  <text x="46" y="134" font-size="13" font-weight="600" fill="#475569">应用层</text>
  <rect x="152" y="107" width="624" height="62" rx="6" fill="#ddd6fe" stroke="#a78bfa"/>
  <text x="464" y="130" font-size="15" font-weight="700" fill="#5b21b6" text-anchor="middle">xgin</text>
  <text x="464" y="151" font-size="11" fill="#6d28d9" text-anchor="middle">Builder 模式 · middleware · options · swagger · trans（中文校验翻译）</text>

  <!-- ================= 生命周期层 ================= -->
  <rect x="32" y="196" width="756" height="92" rx="8" fill="#fffcf2" stroke="#e2e8f0"/>
  <text x="46" y="220" font-size="11" font-weight="700" fill="#b45309">LIFECYCLE</text>
  <text x="46" y="238" font-size="13" font-weight="600" fill="#475569">生命周期层</text>
  <rect x="152" y="211" width="624" height="62" rx="6" fill="#fef3c7" stroke="#fbbf24"/>
  <text x="464" y="234" font-size="15" font-weight="700" fill="#92400e" text-anchor="middle">xserver</text>
  <text x="464" y="255" font-size="11" fill="#b45309" text-anchor="middle">Server 接口 · Run / RunBlocking / R · 信号处理 · 启动失败回滚</text>

  <!-- ================= 服务层 ================= -->
  <rect x="32" y="300" width="756" height="92" rx="8" fill="#f4fdfb" stroke="#e2e8f0"/>
  <text x="46" y="324" font-size="11" font-weight="700" fill="#0f766e">SERVICES</text>
  <text x="46" y="342" font-size="13" font-weight="600" fill="#475569">服务层</text>
  <rect x="152" y="315" width="147" height="62" rx="6" fill="#ccfbf1" stroke="#5eead4"/>
  <text x="225" y="338" font-size="14" font-weight="700" fill="#115e59" text-anchor="middle">xhttp</text>
  <text x="225" y="357" font-size="10" fill="#0f766e" text-anchor="middle">resty · 重试 · 指标</text>
  <rect x="311" y="315" width="147" height="62" rx="6" fill="#ccfbf1" stroke="#5eead4"/>
  <text x="384" y="338" font-size="14" font-weight="700" fill="#115e59" text-anchor="middle">xgorm</text>
  <text x="384" y="357" font-size="10" fill="#0f766e" text-anchor="middle">MySQL / PG · 多数据源</text>
  <rect x="470" y="315" width="147" height="62" rx="6" fill="#ccfbf1" stroke="#5eead4"/>
  <text x="543" y="338" font-size="14" font-weight="700" fill="#115e59" text-anchor="middle">xredis</text>
  <text x="543" y="357" font-size="10" fill="#0f766e" text-anchor="middle">go-redis · 多实例</text>
  <rect x="629" y="315" width="147" height="62" rx="6" fill="#ccfbf1" stroke="#5eead4"/>
  <text x="702" y="338" font-size="14" font-weight="700" fill="#115e59" text-anchor="middle">xcache</text>
  <text x="702" y="357" font-size="10" fill="#0f766e" text-anchor="middle">ristretto · 本地缓存</text>

  <!-- ================= 核心层 ================= -->
  <rect x="32" y="404" width="756" height="92" rx="8" fill="#f5fbff" stroke="#e2e8f0"/>
  <text x="46" y="428" font-size="11" font-weight="700" fill="#0369a1">CORE</text>
  <text x="46" y="446" font-size="13" font-weight="600" fill="#475569">核心层</text>
  <rect x="152" y="419" width="116" height="62" rx="6" fill="#e0f2fe" stroke="#7dd3fc"/>
  <text x="210" y="442" font-size="14" font-weight="700" fill="#075985" text-anchor="middle">xconfig</text>
  <text x="210" y="461" font-size="10" fill="#0369a1" text-anchor="middle">Viper · Profile</text>
  <rect x="279" y="419" width="116" height="62" rx="6" fill="#e0f2fe" stroke="#7dd3fc"/>
  <text x="337" y="442" font-size="14" font-weight="700" fill="#075985" text-anchor="middle">xlog</text>
  <text x="337" y="461" font-size="10" fill="#0369a1" text-anchor="middle">log/slog · 轮转</text>
  <rect x="406" y="419" width="116" height="62" rx="6" fill="#e0f2fe" stroke="#7dd3fc"/>
  <text x="464" y="442" font-size="14" font-weight="700" fill="#075985" text-anchor="middle">xtrace</text>
  <text x="464" y="461" font-size="10" fill="#0369a1" text-anchor="middle">otel · W3C / B3</text>
  <rect x="533" y="419" width="116" height="62" rx="6" fill="#e0f2fe" stroke="#7dd3fc"/>
  <text x="591" y="442" font-size="14" font-weight="700" fill="#075985" text-anchor="middle">xmetric</text>
  <text x="591" y="461" font-size="10" fill="#0369a1" text-anchor="middle">Prometheus</text>
  <rect x="660" y="419" width="116" height="62" rx="6" fill="#e0f2fe" stroke="#7dd3fc"/>
  <text x="718" y="442" font-size="14" font-weight="700" fill="#075985" text-anchor="middle">xflow</text>
  <text x="718" y="461" font-size="10" fill="#0369a1" text-anchor="middle">编排 · 回滚</text>

  <!-- ================= 基础层 ================= -->
  <rect x="32" y="508" width="756" height="92" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="46" y="532" font-size="11" font-weight="700" fill="#475569">FOUNDATION</text>
  <text x="46" y="550" font-size="13" font-weight="600" fill="#475569">基础层</text>
  <text x="46" y="568" font-size="10" fill="#16a34a">零第三方依赖</text>
  <rect x="152" y="523" width="200" height="62" rx="6" fill="#e2e8f0" stroke="#cbd5e1"/>
  <text x="252" y="546" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">xerror</text>
  <text x="252" y="565" font-size="10" fill="#475569" text-anchor="middle">XOneError · 模块化错误</text>
  <rect x="364" y="523" width="200" height="62" rx="6" fill="#e2e8f0" stroke="#cbd5e1"/>
  <text x="464" y="546" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">xutil</text>
  <text x="464" y="565" font-size="10" fill="#475569" text-anchor="middle">Duration · Pool · Future · 重试</text>
  <rect x="576" y="523" width="200" height="62" rx="6" fill="#e2e8f0" stroke="#cbd5e1"/>
  <text x="676" y="546" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">xhook</text>
  <text x="676" y="565" font-size="10" fill="#475569" text-anchor="middle">BeforeStart / BeforeStop</text>

  <!-- ================= 生命周期面板 ================= -->
  <rect x="812" y="92" width="336" height="508" rx="8" fill="#fffcf2" stroke="#fde68a"/>
  <text x="832" y="118" font-size="13" font-weight="700" fill="#92400e">Hook 生命周期</text>
  <text x="832" y="137" font-size="10" fill="#b45309">Order 表示资源层级：值越小越底层</text>
  <text x="832" y="151" font-size="10" fill="#b45309">启动越早、关闭越晚</text>

  <!-- 保留区 -->
  <rect x="832" y="166" width="296" height="34" rx="5" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="844" y="187" font-size="12" font-weight="700" fill="#b91c1c">xconfig</text>
  <text x="1116" y="187" font-size="11" fill="#dc2626" text-anchor="end">Order −100 · 框架保留</text>

  <line x1="980" y1="200" x2="980" y2="212" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrowAmber)"/>

  <rect x="832" y="212" width="296" height="34" rx="5" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="844" y="233" font-size="12" font-weight="700" fill="#b91c1c">xlog</text>
  <text x="1116" y="233" font-size="11" fill="#dc2626" text-anchor="end">Order −50 · 框架保留</text>

  <line x1="980" y1="246" x2="980" y2="258" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrowAmber)"/>

  <!-- 业务区 -->
  <rect x="832" y="258" width="296" height="132" rx="5" fill="#ffffff" stroke="#fbbf24" stroke-dasharray="4 3"/>
  <text x="844" y="279" font-size="12" font-weight="700" fill="#92400e">其余模块与业务资源</text>
  <text x="1116" y="279" font-size="11" fill="#b45309" text-anchor="end">Order 100（默认）</text>
  <text x="844" y="300" font-size="10.5" fill="#78716c">同 Order 内按 init 顺序，而 Go 的 init 顺序是</text>
  <text x="844" y="316" font-size="10.5" fill="#78716c">「拓扑序 + import path 字典序」，<tspan font-weight="700" fill="#b45309">与 import 书写顺序无关</tspan></text>
  <text x="844" y="338" font-size="10.5" fill="#78716c">当前实测：xcache → xflow → xmetric →</text>
  <text x="844" y="354" font-size="10.5" fill="#78716c">xtrace → xredis → xgorm → xhttp</text>
  <text x="844" y="375" font-size="10" fill="#a8a29e">这是 import 路径决定的结果，不是框架承诺</text>

  <!-- BeforeStop -->
  <line x1="980" y1="390" x2="980" y2="404" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrowAmber)"/>
  <rect x="832" y="404" width="296" height="80" rx="5" fill="#fef3c7" stroke="#fbbf24"/>
  <text x="844" y="425" font-size="12" font-weight="700" fill="#92400e">BeforeStop = BeforeStart 的整体镜像</text>
  <text x="844" y="446" font-size="10.5" fill="#78716c">业务资源 → xlog → xconfig，同 Order 内 LIFO</text>
  <text x="844" y="464" font-size="10.5" fill="#78716c">所以业务资源关闭时日志仍可用，其关闭日志</text>
  <text x="844" y="478" font-size="10.5" fill="#78716c">不会丢</text>

  <!-- 强制隔离说明 -->
  <rect x="832" y="496" width="296" height="88" rx="5" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="844" y="517" font-size="11.5" font-weight="700" fill="#475569">负值区是强制隔离的</text>
  <text x="844" y="536" font-size="10.5" fill="#64748b">xhook.Order(n) 对 n &lt; 0 直接 panic；负值只能</text>
  <text x="844" y="552" font-size="10.5" fill="#64748b">经 xhook.ReservedOrder 设置，其参数类型在</text>
  <text x="844" y="568" font-size="10.5" fill="#64748b">internal/hookorder 中，外部 import 编译失败</text>

  <!-- ================= 依赖说明 ================= -->
  <rect x="32" y="616" width="1116" height="106" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="48" y="640" font-size="13" font-weight="700" fill="#334155">模块间依赖</text>

  <circle cx="54" cy="662" r="3" fill="#94a3b8"/>
  <text x="66" y="666" font-size="11.5" fill="#475569">上层可依赖下层，下层不得依赖上层。<tspan font-weight="600">同层之间也确实存在编译依赖</tspan>（如 xhttp / xgorm / xredis → xtrace、xmetric），这些边是真实的 import，不是仅靠 Hook 串起来的。</text>

  <circle cx="54" cy="684" r="3" fill="#94a3b8"/>
  <text x="66" y="688" font-size="11.5" fill="#475569">除基础层外，所有模块都依赖 <tspan font-weight="600">xconfig</tspan> 读配置、<tspan font-weight="600">xhook</tspan> 注册生命周期、<tspan font-weight="600">xerror</tspan> / <tspan font-weight="600">xutil</tspan> 提供错误类型与工具函数。</text>

  <circle cx="54" cy="706" r="3" fill="#94a3b8"/>
  <text x="66" y="710" font-size="11.5" fill="#475569">两条值得注意的边：<tspan font-weight="600">xserver</tspan> 匿名 import <tspan font-weight="600">xtrace</tspan>（默认加载链路）；<tspan font-weight="600">xgin</tspan> 只依赖 xserver / xmetric / xlog / xconfig，<tspan font-weight="600">不依赖任何服务层模块</tspan>。</text>

  <!-- ================= 基础层约束 ================= -->
  <rect x="32" y="736" width="1116" height="72" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="48" y="758" font-size="12.5" font-weight="700" fill="#15803d">基础层零第三方依赖</text>
  <text x="48" y="778" font-size="11.5" fill="#166534">xerror / xutil / xhook 只用标准库 —— 它们几乎会被所有使用者编进去，任何第三方依赖都会转嫁给全部使用者。</text>
  <text x="48" y="796" font-size="11.5" fill="#166534">需要上层能力时走扩展点注入：xutil.SetTraceContextExtractor ← xtrace，xlog.AddObserver ← xmetric / xgin。</text>
</svg>
