A:
  B:
    C: "a.b.c"
    D: ${x}
    E: "${y}"
    F: "${a.b.f}"

Server:
  Name: "xone.demo.app"               # 服务名称(required)，log/trace都会需要这个配置
  Version: "v0.0.1"                   # 服务版本号，trace上报，swagger版本显示等需要使用该配置
  Gin:
    Port: 9000

XLog:
  EnableConsole: true          # 打印到标准输出，由部署环境的日志采集组件收集
  ConsoleFormatIsRaw: true     # 原始的json格式打印
  MaxAge: "3d"

# 业务自定义配置示例，用于验证嵌套结构体与 map 的反序列化
MyApp:
  Backend:
    URL: ${MYAPP_BACKEND_URL:-http://127.0.0.1:8000}
    APIKey: ${MYAPP_BACKEND_API_KEY:-}
    RequestTimeout: "30s"

  Syncer:
    Interval: "5s"
    RequestTimeout: "10s"
    ItemInfoPath: "/api/v1/items"
    UserInfoPath: "/api/v1/users"

  Routes:
    primary:
      Endpoint: "http://127.0.0.1:9001"
      Aliases: ["main", "default"]
      StreamingEnabled: true
    backup:
      Endpoint: "http://127.0.0.1:9002"
      StreamingEnabled: false
